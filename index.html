<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY BRIEF | 今日を5分で</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
  background:#f5f6f8;
  color:#111;
  line-height:1.6;
}

header{
  background:rgba(255,255,255,.95);
  border-bottom:1px solid #e5e5e5;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:900px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}

.date{
  font-size:12px;
  color:#777;
}

main{
  max-width:900px;
  margin:auto;
  padding:26px 16px 60px;
}

.intro{
  margin-bottom:24px;
}

.intro-label{
  color:#2563eb;
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
}

.intro h1{
  font-size:32px;
  line-height:1.2;
  margin:5px 0 9px;
}

.intro p{
  color:#666;
  font-size:15px;
}

nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:30px;
}

nav a{
  flex-shrink:0;
  text-decoration:none;
  background:white;
  color:#333;
  padding:8px 14px;
  border-radius:100px;
  border:1px solid #ddd;
  font-size:14px;
  font-weight:600;
}

nav a:first-child{
  background:#111;
  color:white;
}

.section-title{
  font-size:21px;
  margin:34px 0 15px;
}

.hero{
  background:#111;
  color:white;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:18px;
}

.hero-image{
  height:210px;
  background:linear-gradient(135deg,#172554,#2563eb,#7dd3fc);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
}

.hero-content{
  padding:22px;
}

.tag{
  display:inline-block;
  font-size:11px;
  font-weight:800;
  color:#2563eb;
  margin-bottom:7px;
}

.hero .tag{
  color:#93c5fd;
}

.hero h2{
  font-size:24px;
  line-height:1.35;
  margin-bottom:10px;
}

.summary{
  color:#ddd;
  font-size:15px;
}

.why{
  margin-top:16px;
  padding:13px 14px;
  border-radius:12px;
  background:rgba(255,255,255,.1);
  font-size:14px;
}

.source{
  display:block;
  color:#999;
  font-size:11px;
  margin-top:13px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.card{
  background:white;
  border-radius:17px;
  overflow:hidden;
  border:1px solid #e6e6e6;
}

.card-image{
  height:135px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  background:#e9eef5;
}

.card-content{
  padding:16px;
}

.card h3{
  font-size:17px;
  line-height:1.4;
  margin-bottom:8px;
}

.card p{
  color:#666;
  font-size:14px;
}

.daily-summary{
  margin-top:38px;
  background:#e9efff;
  padding:22px;
  border-radius:18px;
}

.daily-summary h2{
  font-size:19px;
  margin-bottom:8px;
}

footer{
  text-align:center;
  color:#999;
  padding:35px 20px;
  font-size:12px;
}

@media(max-width:600px){
  .intro h1{font-size:29px}
  .grid{grid-template-columns:1fr}
  .hero-image{height:185px}
  .hero h2{font-size:22px}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">DAILY BRIEF</div>
    <div class="date" id="date"></div>
  </div>
</header>

<main>

<section class="intro">
  <div class="intro-label">DAILY NEWS DIGEST</div>
  <h1>今日を、5分で。</h1>
  <p>国内・世界・経済・テクノロジー。今日知っておきたいニュースだけを、短く分かりやすく。</p>
</section>

<nav>
  <a href="#top">🔥 TOP</a>
  <a href="#japan">🇯🇵 国内</a>
  <a href="#world">🌍 国際</a>
  <a href="#money">💰 経済</a>
  <a href="#tech">🤖 TECH / AI</a>
</nav>

<section id="top">
  <h2 class="section-title">🔥 TODAY'S TOP</h2>
  <div id="topNews"></div>
</section>

<section id="japan">
  <h2 class="section-title">🇯🇵 国内</h2>
  <div class="grid" id="japanNews"></div>
</section>

<section id="world">
  <h2 class="section-title">🌍 国際</h2>
  <div class="grid" id="worldNews"></div>
</section>

<section id="money">
  <h2 class="section-title">💰 経済</h2>
  <div class="grid" id="economyNews"></div>
</section>

<section id="tech">
  <h2 class="section-title">🤖 TECH / AI</h2>
  <div class="grid" id="techNews"></div>
</section>

<section class="daily-summary">
  <h2>☕ 今日を一言で</h2>
  <p>今日の重要ニュースを5分で把握。</p>
</section>

</main>

<footer>
DAILY BRIEF<br>
Understand today in 5 minutes.
</footer>

<script src="news.js"></script>

<script>
document.getElementById("date").textContent = newsData.date;

document.getElementById("topNews").innerHTML = `
<article class="hero">
  <div class="hero-image">${newsData.top.emoji}</div>

  <div class="hero-content">
    <span class="tag">${newsData.top.category}</span>

    <h2>${newsData.top.title}</h2>

    <p class="summary">
      ${newsData.top.summary}
    </p>

    <div class="why">
      <strong>💡 なぜ重要？</strong><br>
      ${newsData.top.why}
    </div>

    <span class="source">
      ${newsData.top.source}
    </span>
  </div>
</article>
`;

function makeCards(items){
  return items.map(item => `
    <article class="card">

      <div class="card-image">
        ${item.emoji}
      </div>

      <div class="card-content">
        <span class="tag">${item.category}</span>

        <h3>${item.title}</h3>

        <p>${item.summary}</p>

        <span class="source">
          ${item.source}
        </span>
      </div>

    </article>
  `).join("");
}

document.getElementById("japanNews").innerHTML =
  makeCards(newsData.japan);

document.getElementById("worldNews").innerHTML =
  makeCards(newsData.world);

document.getElementById("economyNews").innerHTML =
  makeCards(newsData.economy);

document.getElementById("techNews").innerHTML =
  makeCards(newsData.tech);
</script>

</body>
</html>
